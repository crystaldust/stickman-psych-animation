[project]
name = "stickman"
version = "0.1.0"
description = "Tools for a stickman animation channel: Bilibili collection, transcript analysis and script writing"
readme = "README.md"
authors = [
    { name = "Lance", email = "lance@m4-air" }
]
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1,<0.43",  # 换版本可能改变字幕切点
    "mlx-whisper>=0.4.3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
stickman = "stickman.cli:run"
bili-collect = "stickman.collect.bilibili.cli:run"  # 兼容旧命令

[tool.uv.build-backend]
module-name = "stickman"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning:jieba.*"]  # jieba 0.42.1 的正则在 3.12 上报无效转义

[tool.coverage.run]
# 默认的 CTracer 下 jieba 初始化要好几分钟（不开覆盖率只要 0.5 秒）；sys.monitoring 不追踪 stickman 以外的代码。
# 3.12 上 sysmon 不支持 branch 覆盖，要开 --cov-branch 得另想办法
core = "sysmon"
